<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placar ao vivo</title>
<meta name="description" content="Placar ao vivo das checagens: Fato, Fake e Não é bem assim, com quantidade e porcentagem por candidato.">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb; --track: #eef0f3;
    --fato: #16a34a; --fake: #dc2626; --parcial: #d97706; --live: #ef4444;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d12; --card: #151922; --text: #f3f4f6; --muted: #9ca3af; --line: #262b36; --track: #232836;
      --fato: #22c55e; --fake: #ef4444; --parcial: #f59e0b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; }
  header h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 10px; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--live); text-transform: uppercase; letter-spacing: .04em; }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: pulse 1.4s infinite; }
  .live.off { color: var(--muted); } .live.off::before { background: var(--muted); animation: none; }
  @keyframes pulse { 50% { opacity: .25; } }
  .sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-top: 16px; }
  .total { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .total b { font-size: 34px; font-variant-numeric: tabular-nums; }
  .stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--track); margin: 12px 0 4px; }
  .stack span { transition: width .6s; }
  .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .cat { border-left: 4px solid; padding: 2px 0 2px 10px; }
  .cat .n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cat .l { font-size: 13px; color: var(--muted); }
  .cat .p { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  h2 { font-size: 16px; margin: 0 0 4px; }
  .sp + .sp { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  .sp-head { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }
  .sp-head b { color: var(--text); font-size: 15px; }
  .rows { margin-top: 8px; display: grid; gap: 6px; }
  .row { display: grid; grid-template-columns: 130px 1fr 92px; align-items: center; gap: 10px; font-size: 14px; }
  .bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .bar span { display: block; height: 100%; transition: width .6s; }
  .row .v { text-align: right; font-variant-numeric: tabular-nums; }
  footer { margin-top: 20px; color: var(--muted); font-size: 13px; }
  footer a { color: inherit; }
  .warn { color: var(--parcial); }
  @media (max-width: 520px) {
    .cats { grid-template-columns: 1fr; }
    .row { grid-template-columns: 1fr 72px; }
    .row .bar { grid-column: 1 / -1; grid-row: 2; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Placar ao vivo <span id="live" class="live off">—</span></h1>
    <p class="sub" id="title">Carregando…</p>
  </header>

  <section class="card">
    <div class="total"><span>Checagens</span><b id="total">—</b></div>
    <div class="stack" id="stack" aria-hidden="true"></div>
    <div class="cats" id="cats"></div>
  </section>

  <section class="card" id="speakers" hidden></section>

  <footer>
    <div id="meta"></div>
    <p>Placar não oficial, montado com os dados públicos do
      <a id="src" href="https://www.checagemaovivo.org" target="_blank" rel="noopener">checagemaovivo.org</a>,
      onde estão as checagens completas, as fontes e o aviso sobre o uso de IA. Atualiza sozinho a cada 10 segundos.
      Checagens inconclusivas ficam fora das porcentagens.</p>
  </footer>
</main>
<script>
  const CATS = [
    { key: 'fato', label: 'Fato', color: 'var(--fato)' },
    { key: 'fake', label: 'Fake', color: 'var(--fake)' },
    { key: 'parcial', label: 'Não é bem assim', color: 'var(--parcial)' },
  ];
  const $ = (id) => document.getElementById(id);
  const pct = (n, t) => (t ? (n / t) * 100 : 0);
  const fmt = (n, t) => pct(n, t).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const sala = new URLSearchParams(location.search).get('sala');

  function render(d) {
    const t = d.totals;
    const live = d.room.status === 'live';
    $('live').textContent = live ? 'ao vivo' : (d.room.status === 'ended' ? 'encerrado' : (d.room.status ?? '—'));
    $('live').className = 'live' + (live ? '' : ' off');
    $('title').textContent = [d.room.title, d.room.topic].filter(Boolean).join(' · ');
    document.title = `Placar · ${d.room.title}`;
    $('total').textContent = t.total;
    $('stack').innerHTML = CATS.map((c) => `<span style="width:${pct(t[c.key], t.total)}%;background:${c.color}"></span>`).join('');
    $('cats').innerHTML = CATS.map((c) => `
      <div class="cat" style="border-color:${c.color}">
        <div class="n">${t[c.key]}</div>
        <div class="p" style="color:${c.color}">${fmt(t[c.key], t.total)}</div>
        <div class="l">${c.label}</div>
      </div>`).join('');
    const sp = d.speakers.filter((s) => s.total > 0);
    $('speakers').hidden = !sp.length;
    $('speakers').innerHTML = sp.map((s) => `
      <div class="sp">
        <div class="sp-head"><b>${esc(s.name)}</b><span>${s.total} ${s.total === 1 ? 'checagem' : 'checagens'}</span></div>
        <div class="rows">${CATS.map((c) => `
          <div class="row">
            <span>${c.label}</span>
            <div class="bar"><span style="width:${pct(s[c.key], s.total)}%;background:${c.color}"></span></div>
            <span class="v">${s[c.key]} · ${fmt(s[c.key], s.total)}</span>
          </div>`).join('')}
        </div>
      </div>`).join('');
    $('src').href = d.source;
    const extra = [`inconclusivas: ${t.inconclusivo}`, `pendentes: ${t.pendente}`];
    const when = new Date(d.fetchedAt).toLocaleTimeString('pt-BR');
    $('meta').innerHTML = `${extra.join(' · ')} · atualizado às ${when}` +
      (d.stale ? ` · <span class="warn">fonte fora do ar, mostrando o último placar</span>` : '');
  }

  async function tick() {
    try {
      const r = await fetch('/api/placar' + (sala ? `?sala=${encodeURIComponent(sala)}` : ''), { cache: 'no-store' });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.status);
      render(d);
    } catch (e) {
      $('meta').innerHTML = `<span class="warn">Não consegui atualizar agora (${esc(e.message)}). Tentando de novo…</span>`;
    }
  }
  tick();
  setInterval(tick, 10000);
</script>
</body>
</html>
